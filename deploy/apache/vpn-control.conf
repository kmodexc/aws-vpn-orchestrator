# Example Apache 2.4 reverse-proxy vhosts for the vpn-control stack.
# Replace vpn.example.com with your DOMAIN and 11001 with APP_HOST_PORT from .env.
# Needs: a2enmod ssl proxy proxy_http headers rewrite http2 setenvif
# Certificate: sudo certbot certonly --apache -d vpn.example.com   (before enabling this site)

<VirtualHost *:80>
    ServerName vpn.example.com

    # Plain HTTP only redirects; certbot's apache plugin handles the ACME challenge itself.
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =vpn.example.com
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<VirtualHost *:443>
    ServerName vpn.example.com
    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/vpn.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/vpn.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # vpn-control listens on 127.0.0.1:1xxyy (here 11001 = stack 10, port 01).
    ProxyRequests Off
    ProxyPreserveHost On
    # IP rotation may take up to 90 s.
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:11001/ retry=0
    ProxyPassReverse / http://127.0.0.1:11001/
    # mod_proxy appends the real client IP to X-Forwarded-For; the app uses the right-most entry.
    RequestHeader set X-Forwarded-Proto "https"

    # The app rejects bodies > 16 KiB anyway; stop large uploads at the edge.
    LimitRequestBody 65536

    # Security headers (HSTS, CSP, ...) are set by the app itself and passed through.

    # Never write secret URL tokens or OAuth codes to the access log:
    # /s/<SUB_TOKEN>, /i/<INGRESS_TOKEN>/config.json and /auth/callback?code=...
    SetEnvIf Request_URI "^/(s|i)/" redact_url
    SetEnvIf Request_URI "^/auth/callback" redact_url
    CustomLog ${APACHE_LOG_DIR}/vpn-control.access.log combined env=!redact_url
    CustomLog ${APACHE_LOG_DIR}/vpn-control.access.log "%h %l %u %t \"%m [redacted] %H\" %>s %b" env=redact_url
    ErrorLog  ${APACHE_LOG_DIR}/vpn-control.error.log
</VirtualHost>
